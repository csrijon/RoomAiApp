buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // ✅ ANDROID GRADLE PLUGIN (version MUST be specified)
        classpath("com.android.tools.build:gradle:8.3.2")

        // ✅ REACT NATIVE GRADLE PLUGIN (version from node_modules)
        classpath("com.facebook.react:react-native-gradle-plugin:0.82.1")
    }
}

apply plugin: "com.facebook.react.rootproject"
