# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# 🔥 Disable New Architecture (Fabric + TurboModules + Codegen)
newArchEnabled=true
hermesCodegenEnabled=false
reactNativeCodegenEnabled=false
codegenDisabled=true

# 🔥 Hermes ON is OK (does not cause error)
hermesEnabled=true

# UI flag
edgeToEdgeEnabled=false
